[tool.pytest.ini_options]
# Second, independent safety net alongside ui_limits.MAX_TREE_NODES: a
# per-test wall-clock cap so any hang (this bug class or a future one)
# fails the test in seconds instead of running until it exhausts host
# memory -- which previously took down shared test infrastructure.
# Requires the `pytest-timeout` package in whatever environment runs these
# suites (corridor's and pixelagents' alike).
addopts = "--timeout=30"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "pixelagents/conftest.py",
    "pixelagents/tests/conftest.py",
    "floorplan/conftest.py",
    "floorplan/tests/conftest.py",
    "floorplan/tests/test_floorplan.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
# Every production cog module is part of the strict type gate (corridor
# includes the shared component-limit checker, ui_limits.py).
files = [
    "pixelagents",
    "floorplan",
    "corridor",
    "toolbox",
    "pico",
    "testbench",
    "deskutils",
    "architect",
    "suggestionbox",
    "painter",
    "cctv",
    "telephonepole",
    "bootcamp",
]
exclude = [
    "^pixelagents/conftest\\.py$",
    "^pixelagents/tests/",
    "^floorplan/conftest\\.py$",
    "^floorplan/tests/",
    "^corridor/conftest\\.py$",
    "^corridor/testing\\.py$",
    "^corridor/tests/",
    "^toolbox/conftest\\.py$",
    "^toolbox/tests/",
    "^pico/conftest\\.py$",
    "^pico/tests/",
    "^testbench/conftest\\.py$",
    "^testbench/tests/",
    "^deskutils/conftest\\.py$",
    "^deskutils/tests/",
    "^architect/conftest\\.py$",
    "^architect/tests/",
    "^suggestionbox/conftest\\.py$",
    "^suggestionbox/tests/",
    "^painter/conftest\\.py$",
    "^painter/tests/",
    "^cctv/conftest\\.py$",
    "^cctv/tests/",
    "^telephonepole/conftest\\.py$",
    "^telephonepole/tests/",
    "^bootcamp/conftest\\.py$",
    "^bootcamp/tests/",
]

[[tool.mypy.overrides]]
# Red's HybridGroup decorator loses the mixin callback type, and its untyped
# Context leaks Any from `ctx.guild` when Red is absent from the type job.
module = ["pixelagents.adapters.commands"]
disable_error_code = ["arg-type", "no-any-return", "untyped-decorator"]

[[tool.mypy.overrides]]
# The real Red Cog metaclass is not installed in the lightweight type job, so
# `commands.Cog` resolves to Any there. The composition module remains checked.
module = ["pixelagents.pixelagents"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# Same gap as pixelagents.adapters.commands above, mirrored for floorplan:
# Red is absent from the lightweight CI type environment, so its decorators
# are dynamically typed. Keep the adapters otherwise strict.
module = [
    "floorplan.adapters.catalogue_commands",
    "floorplan.adapters.dashboard",
    "floorplan.adapters.discord_gateway",
]
disable_error_code = ["untyped-decorator"]

