# Consumer-driven contract for Pixel Index, owned by office-cogs.
#
# This describes ONLY the subset of the Pixel Index API that pixelagents.py
# actually calls (see contracts/pixel-index/verify.py and docs/contract-testing.md).
# It must NOT be regenerated from pixel-index's full OpenAPI/AsyncAPI spec —
# fields pixel-index adds that we don't read here on purpose, so unrelated
# provider changes don't fail this check.
#
# Update this file (and the corresponding code in pixelagents.py) together
# whenever office-cogs starts, stops, or changes how it uses a field.

version: 1

endpoints:
  - name: health
    method: GET
    path: /health
    expect_status: 200
    # Body isn't parsed by the bot (_check_pixel_index_health only checks the
    # status code) so no schema is asserted here.

  - name: list_layouts
    method: GET
    path: /api/v1/layouts
    query:
      sort: newest
      limit: 1
    expect_status: 200
    schema:
      type: object
      required: [layouts, total]
      properties:
        layouts:
          type: array
          items:
            type: object
            required: [slug, title, author, description, tags, files]
            properties:
              slug: { type: string }
              title: { type: string }
              description: { type: string }
              tags:
                type: array
                items: { type: string }
              author:
                type: object
                required: [discordId, username, displayName, avatarUrl]
              files:
                type: object
                required: [thumbnail]
                properties:
                  thumbnail: { type: string }
        total: { type: integer }
        nextCursor: { type: [string, "null"] }
    # Feeds layout_detail below so it can be checked against a real slug
    # instead of a hardcoded one that could disappear from the environment.
    derive:
      layout_slug: "layouts[0].slug"

  - name: layout_detail
    method: GET
    path: /api/v1/layouts/{slug}
    path_params:
      slug: "$layout_slug"
    # Only runs if list_layouts derived a slug (i.e. the environment has at
    # least one published layout). Skipped, not failed, otherwise.
    requires_var: layout_slug
    expect_status: 200
    schema:
      type: object
      required: [slug, title, author, description, tags, files, layout]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        author:
          type: object
          required: [discordId, username, displayName, avatarUrl]
        files:
          type: object
          required: [preview, layout]
          properties:
            preview: { type: string }
            layout: { type: string }
        layout:
          type: object
          required: [version, cols, rows, tiles, furniture]
          properties:
            version: { const: 1 }
            cols: { type: integer }
            rows: { type: integer }
            tiles: { type: array }
            furniture: { type: array }
