name: "Cogs Quality"

on:
  push:
    paths:
      - "corridor/**/*.py"
      - "pixelagents/**/*.py"
      - "pixelagents/infrastructure/webview_vendor.commit"
      - "pixelagents/infrastructure/webview_build_scripts/**"
      - "floorplan/**/*.py"
      - "toolbox/**/*.py"
      - "pico/**/*.py"
      - "testbench/**/*.py"
      - "deskutils/**/*.py"
      - "architect/**/*.py"
      - "suggestionbox/**/*.py"
      - "contracts/pixel_index/**"
      - "contracts/pixel_agents/**"
      - "contracts/corridor/**"
      - "corridor/corridor.yaml"
      - "docs/corridor-pubsub-design.md"
      - "pyproject.toml"
      - ".github/workflows/cogs-quality.yml"
  pull_request:
    paths:
      - "corridor/**/*.py"
      - "pixelagents/**/*.py"
      - "pixelagents/infrastructure/webview_vendor.commit"
      - "pixelagents/infrastructure/webview_build_scripts/**"
      - "floorplan/**/*.py"
      - "toolbox/**/*.py"
      - "pico/**/*.py"
      - "testbench/**/*.py"
      - "deskutils/**/*.py"
      - "architect/**/*.py"
      - "suggestionbox/**/*.py"
      - "contracts/pixel_index/**"
      - "contracts/pixel_agents/**"
      - "contracts/corridor/**"
      - "corridor/corridor.yaml"
      - "docs/corridor-pubsub-design.md"
      - "pyproject.toml"
      - ".github/workflows/cogs-quality.yml"

permissions:
  contents: read

concurrency:
  group: cogs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and types (${{ matrix.cog }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # corridor now also owns the shared LLM connection (LiteLLMClient,
          # moved from pico -- see docs/architect-design.md), so unlike
          # toolbox/testbench below it needs aiohttp/pydantic too. The <2.12
          # cap (here and on every other pydantic pin below, matching each
          # cog's info.json) keeps us off pydantic 2.12+, which requires
          # typing_extensions>=4.14.1 for its new Sentinel import -- Red-
          # DiscordBot pins typing_extensions==4.13.2 in site-packages and
          # appends the Downloader's cog-requirements lib dir *after*
          # site-packages on sys.path (redbot/__main__.py), so a newer
          # typing_extensions installed there is shadowed by Red's older
          # pinned one and Sentinel fails to import at runtime.
          # corridor.domain.agent_directory imports a2a's AgentExecutor/
          # AgentCard/TransportProtocol types directly (see that module's
          # docstring), and corridor.adapters.cog_base unconditionally
          # imports corridor.infrastructure.A2AServer -- corridor's own
          # process-wide A2A listener (uvicorn/Starlette on top of a2a-sdk's
          # http-server extra), even for cogs that never start it. Needs the
          # same 'a2a-sdk[http-server]'+uvicorn pair as architect/pico below.
          # mcp's own dependency chain (pydantic-settings -> typing-inspection)
          # hit this exact same typing_extensions incident a second, unrelated
          # way: typing-inspection>=0.4.3 itself requires typing_extensions
          # >=4.15.0 (0.4.0-0.4.2 only need >=4.12.0), and nothing pinned it
          # before mcp. 'typing-inspection<0.4.3' is declared on every cog
          # whose own info.json requirements include pydantic at all
          # (architect/corridor/floorplan/pico), not only the one that added
          # mcp -- the real Downloader installs every loaded cog's
          # requirements into one shared dir via repeated `pip install
          # --target` calls, which never replace an already-installed
          # package without --upgrade, so whichever cog happens to install
          # first has to plant a compatible version itself; corridor's own
          # pin alone cannot undo an incompatible one an earlier cog already
          # planted. See corridor/infrastructure/mcp_client.py's own
          # docstring for the full incident writeup.
          - cog: corridor
            test_target: "corridor/"
            lint_target: "corridor"
            mypy_target: "corridor"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.12' 'pyyaml>=6.0' 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # toolbox's tests import corridor.adapters (tool registration/
          # panel wiring), which pulls in corridor.infrastructure.A2AServer --
          # needs a2a-sdk[http-server]+uvicorn for the same reason as
          # corridor's own leg above.
          - cog: toolbox
            test_target: "toolbox/"
            lint_target: "toolbox"
            mypy_target: "toolbox"
            extra_deps: "'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # testbench's schema comes from corridor.event_catalog.build_contract()
          # in-process (no YAML parsing at runtime) -- no pyyaml needed here,
          # unlike corridor's own leg above (which needs it for the
          # contracts.corridor.generate_corridor_contract/lint_corridor_contract
          # steps below).
          # testbench's tests import corridor.adapters/corridor.event_catalog,
          # which pull in corridor.infrastructure.A2AServer -- needs
          # a2a-sdk[http-server]+uvicorn for the same reason as corridor's
          # own leg above.
          - cog: testbench
            test_target: "testbench/"
            lint_target: "testbench"
            mypy_target: "testbench"
            extra_deps: "'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # pixelagents shrank to a vendor+build utility cog (like toolbox) --
          # no aiohttp/pydantic left, and no Pixel Index contracts of its own.
          - cog: pixelagents
            test_target: "pixelagents/tests"
            lint_target: "pixelagents"
            mypy_target: "pixelagents"
            extra_deps: "'pyyaml>=6.0' 'jsonschema>=4.20'"
            pixel_index_contracts: false
          # floorplan inherited the runtime half of the old pixelagents Cog:
          # the dashboard, office WebSocket protocol, and Pixel Index
          # integration, so it inherits that half's dependencies too.
          # floorplan's tests also import corridor.adapters, which pulls in
          # corridor.infrastructure.A2AServer -- needs a2a-sdk[http-server]+
          # uvicorn for the same reason as corridor's own leg above.
          - cog: floorplan
            test_target: "floorplan/tests"
            lint_target: "floorplan"
            mypy_target: "floorplan"
            extra_deps: "aiohttp 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: true
          # pico talks to aiohttp (LiteLLM proxy) and pydantic (wire/tool
          # models) like floorplan, plus httpx and a2a-sdk for its
          # consult_architect A2A client tool (pico/infrastructure/
          # architect_client.py). pico/tests/test_architect_client.py also
          # spins up a real, live loopback architect.infrastructure.
          # a2a_server.A2AServer (see that test module's docstring), so it
          # needs architect's http-server extra and uvicorn too -- no Pixel
          # Index integration of its own.
          - cog: pico
            test_target: "pico/"
            lint_target: "pico"
            mypy_target: "pico"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.12' httpx 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # deskutils only reads the system clock and stdlib zoneinfo itself,
          # but its LLM tool metadata tests import corridor.adapters.
          # llm_tool_registration, which pulls in corridor's LLM client --
          # needs pydantic like corridor's own leg above (aiohttp already
          # comes in via discord.py), plus a2a-sdk[http-server]+uvicorn since
          # that same corridor.adapters chain now pulls in corridor.
          # infrastructure.A2AServer too.
          - cog: deskutils
            test_target: "deskutils/"
            lint_target: "deskutils"
            mypy_target: "deskutils"
            extra_deps: "'pydantic>=2.11.3,<2.12' 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # architect talks to aiohttp/pydantic like pico (the shared
          # corridor-owned LLM connection), plus a2a-sdk (its A2A server --
          # http-server extra pulls in starlette/sse-starlette) and uvicorn
          # to run its dedicated listener. No Pixel Index integration.
          - cog: architect
            test_target: "architect/"
            lint_target: "architect"
            mypy_target: "architect"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.12' 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false
          # suggestionbox runs its own MCP server (mcp>=1.29,<2, pinned below
          # mcp 2.0's FastMCP->MCPServer rename -- see corridor/infrastructure/
          # mcp_client.py) and its tests import corridor.infrastructure.
          # mcp_client directly, which (like corridor.adapters.cog_base
          # elsewhere in this matrix) pulls in corridor.infrastructure's
          # whole eager import chain -- A2AServer (a2a-sdk[http-server] +
          # uvicorn) and LiteLLMClient (aiohttp + pydantic) included.
          - cog: suggestionbox
            test_target: "suggestionbox/"
            lint_target: "suggestionbox"
            mypy_target: "suggestionbox"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.12' 'a2a-sdk[http-server]' uvicorn 'mcp>=1.29,<2' 'typing-inspection<0.4.3'"
            pixel_index_contracts: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py>=2.7,<2.8' pytest pytest-timeout ruff mypy ${{ matrix.extra_deps }}

      - name: Install Pixel Index contract dependencies
        if: matrix.pixel_index_contracts
        run: python -m pip install -r contracts/pixel_index/requirements.txt

      - name: Run ${{ matrix.cog }} tests
        # Each cog installs its own, mutually incompatible
        # `sys.modules["redbot.core"]` stub -- running more than one cog's
        # suite in the same pytest process makes whichever collects first
        # silently win for the whole session. The matrix keeps each cog in
        # its own job/process instead of one combined run.
        run: python -m pytest -q ${{ matrix.test_target }}

      - name: Check formatting
        run: ruff format --check ${{ matrix.lint_target }}

      - name: Run Ruff
        run: ruff check ${{ matrix.lint_target }}

      - name: Test shared lint tooling (contracts/ast_call_graph.py)
        # Also cross-cog, not scoped to matrix.lint_target -- run once.
        if: matrix.cog == 'corridor'
        run: python -m unittest discover -s contracts/tests

      - name: Check reply-channel compliance (respects corridor's ReplyMode)
        # Scans corridor/floorplan/pixelagents/toolbox together in one pass
        # (it's a cross-cog check, not scoped to matrix.lint_target) -- run
        # it once rather than once per matrix leg.
        if: matrix.cog == 'corridor'
        run: python -m contracts.discord_replies.lint_reply_channel

      - name: Check production typing
        # Scoped to this cog's own files: an unscoped `python -m mypy` would
        # check pyproject.toml's full `files` list, which spans every cog --
        # pulling in dependencies (aiohttp/pydantic) a corridor/toolbox-only
        # job has no other reason to install.
        run: python -m mypy ${{ matrix.mypy_target }}

      - name: Check Pixel Index endpoint registration
        if: matrix.pixel_index_contracts
        run: python -m contracts.pixel_index.lint_endpoints

      - name: Check Pixel Index model usage
        if: matrix.pixel_index_contracts
        run: python -m contracts.pixel_index.lint_model_usage

      - name: Test contract reporting
        if: matrix.pixel_index_contracts
        run: python -m unittest discover -s contracts/pixel_index/tests

      - name: Test Pixel Agents contract reporting
        # Exercises pixelagents' build pipeline *and* floorplan's
        # WebviewAssetProvider consuming it (see contracts/pixel_agents/verify.py)
        # -- needs floorplan's deps (pydantic, via this leg's Pixel Index
        # contract install above), so it runs on the floorplan leg rather
        # than pixelagents'. This discover also picks up
        # test_generate_consumer_contract.py/test_lint_outbound_contract.py
        # (below) automatically -- no separate step needed for those here.
        if: matrix.cog == 'floorplan'
        run: python -m unittest discover -s contracts/pixel_agents/tests

      - name: Check pixel-agents-consumer-contract.yaml is up to date
        # Offline -- pixelagents/contracts/outbound.py + application/office.py
        # are plain-stdlib TypedDicts, no clone/floorplan deps needed. See
        # .github/workflows/pixel-agents-contract-lint.yml for the dedicated,
        # narrower-triggered version of these same two checks.
        if: matrix.cog == 'pixelagents'
        run: python -m contracts.pixel_agents.generate_consumer_contract --check

      - name: Check outbound builders match the committed consumer contract
        if: matrix.cog == 'pixelagents'
        run: python -m contracts.pixel_agents.lint_outbound_contract

      - name: Check corridor.yaml is up to date
        # Offline -- corridor/domain/models.py is plain-stdlib dataclasses,
        # no clone/network needed.
        if: matrix.cog == 'corridor'
        run: python -m contracts.corridor.generate_corridor_contract --check

      - name: Check corridor.yaml matches the design doc
        if: matrix.cog == 'corridor'
        run: python -m contracts.corridor.lint_corridor_contract

      - name: Test corridor contract tooling
        if: matrix.cog == 'corridor'
        run: python -m unittest discover -s contracts/corridor/tests
