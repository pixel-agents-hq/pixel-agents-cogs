name: "Toolbox Quality"

on:
  push:
    paths:
      - "toolbox/**/*.py"
      - "corridor/testing.py"
      - "pyproject.toml"
      - ".github/workflows/toolbox-quality.yml"
  pull_request:
    paths:
      - "toolbox/**/*.py"
      - "corridor/testing.py"
      - "pyproject.toml"
      - ".github/workflows/toolbox-quality.yml"

permissions:
  contents: read

concurrency:
  group: toolbox-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py>=2.7,<2.8' pytest pytest-timeout ruff mypy

      - name: Run Toolbox tests
        # toolbox reuses corridor's shared redbot/discord stubs (corridor's
        # conftest.py installs its own, mutually incompatible set) -- see
        # corridor-quality.yml's matching step for why each cog's suite runs
        # in its own pytest process instead of one combined run.
        run: python -m pytest -q toolbox/

      - name: Check formatting
        run: ruff format --check toolbox

      - name: Run Ruff
        run: ruff check toolbox

      - name: Check production typing
        # Scoped to toolbox's own files: `python -m mypy` with no args would
        # check pyproject.toml's full `files` list, which also includes
        # pixelagents -- pulling in pydantic/aiohttp as dependencies this
        # job has no other reason to install.
        run: python -m mypy toolbox
