name: "info.json and README"

# Red's Approved Cog Creator guide requires a root README and, in every
# info.json, author/short/description plus an install_msg disclosure. This
# keeps them from silently going missing, and keeps every cog's
# min/max_bot_version on one tested Red range, and every cog on the one
# pixel-agents-deps requirement (requirements/README.md). Also tests
# contracts/red_release, which raises that range for red-release.yml.
# Stdlib only: no dependencies.
on:
  push:
    paths:
      - "info.json"
      - "*/info.json"
      - "README.md"
      - ".cookiecutter/cog-cookiecutter/cookiecutter.json"
      - ".cookiecutter/cog-cookiecutter/*/info.json"
      - "requirements/**"
      - "contracts/info_json/**"
      - "contracts/red_release/**"
      - ".github/workflows/info-json.yml"
  pull_request:
    paths:
      - "info.json"
      - "*/info.json"
      - "README.md"
      - ".cookiecutter/cog-cookiecutter/cookiecutter.json"
      - ".cookiecutter/cog-cookiecutter/*/info.json"
      - "requirements/**"
      - "contracts/info_json/**"
      - "contracts/red_release/**"
      - ".github/workflows/info-json.yml"

permissions:
  contents: read

concurrency:
  group: info-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: info.json and README completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check info.json files and README.md
        run: python -m contracts.info_json.lint_info_json

      # The requirement installs from this tag, so it must exist and hold
      # this branch's requirements/pyproject.toml.
      - name: Check the pixel-agents-deps tag
        run: |
          tag="$(python -m contracts.info_json.lint_info_json --deps-tag)"
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          python -m contracts.info_json.lint_info_json --deps-tag --check

      - name: Test the info.json lint
        run: python -m unittest discover -s contracts/info_json/tests

      - name: Test the Red release tracker
        run: python -m unittest discover -s contracts/red_release/tests
