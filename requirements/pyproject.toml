# Every third-party package the cogs import, with every pin, in one
# distribution. Each cog's info.json lists this package as its only
# requirement, so Red's Downloader installs all of it in one pip run and the
# pins hold. See requirements/README.md before changing anything here.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-agents-deps"
# Bump with every change below; the info.json requirements point at the
# tag pixel-agents-deps-v<version>.
version = "1"
description = "Third-party requirements of pixel-agents-cogs, resolved in one pip run."
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "httpx",
    "a2a-sdk[http-server]",
    "uvicorn",
    "mcp>=1.29,<2",
    # Red pins typing-extensions 4.13.2 in site-packages, which shadows
    # Downloader's lib dir. These are the last releases that import with it:
    # pydantic 2.12 needs typing_extensions.Sentinel, typing-inspection 0.4.3
    # needs typing_extensions>=4.15 and anyio 4.15 needs
    # typing_extensions.sentinel.
    "pydantic>=2.11.3,<2.12",
    "typing-inspection<0.4.3",
    "anyio<4.15",
]

[tool.setuptools]
packages = []
