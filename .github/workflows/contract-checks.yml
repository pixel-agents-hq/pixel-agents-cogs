name: "Contract Checks"

# Covers two independent consumer-driven contracts -- Pixel Index (HTTP API)
# and Pixel Agents (vendored webview source) -- in one workflow so both can
# publish to the same GitHub Pages status site without one deploy clobbering
# the other's latest results (actions/deploy-pages replaces the whole site
# every run). See docs/contract-testing.md.

on:
  push:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/pixel_index/**"
      - "contracts/pixel_agents/**"
      - "pixelagents/**/*.py"
      - "pixelagents/infrastructure/webview_vendor.commit"
      - "pixelagents/infrastructure/webview_build_scripts/**"
      - "floorplan/**/*.py"
      - ".github/workflows/contract-checks.yml"

permissions:
  contents: read

concurrency:
  group: contract-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    name: Verify Pixel Index (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            base_url: https://pixel-index-api.nntin.xyz
          - name: staging
            base_url: https://pixel-index-api-staging.nntin.xyz
          # Add more environments here as they come online.

    steps:
      - name: Initialize contract result
        env:
          ENVIRONMENT_NAME: ${{ matrix.name }}
          BASE_URL: ${{ matrix.base_url }}
          RESULT_PATH: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg environment "$ENVIRONMENT_NAME" \
            --arg base_url "$BASE_URL" \
            '{
              schema_version: 1,
              environment: $environment,
              base_url: $base_url,
              status: "unknown",
              checked_at: null,
              counts: {pass: 0, fail: 0, skipped: 0},
              endpoints: [],
              detail: "The contract check did not complete. Inspect the workflow run for an infrastructure or setup failure."
            }' > "$RESULT_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r contracts/pixel_index/requirements.txt

      - name: Run contract check
        # Regenerates contract.yaml from floorplan/contracts/pixel_index.py + endpoints.py
        # before checking — see contracts/pixel_index/generate_contract.py.
        run: |
          python -m contracts.pixel_index.verify \
            --base-url "${{ matrix.base_url }}" \
            --env-name "${{ matrix.name }}" \
            --output-json "${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json"

      - name: Upload contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-index-contract-result-${{ matrix.name }}
          path: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Notify on failure
        if: failure()
        uses: nntin/d-flows/actions/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message_type: "embed"
          title: "❌ Pixel Index contract check failed (${{ matrix.name }})"
          description: >-
            office-cogs' contract against ${{ matrix.base_url }} failed. Do not
            switch `[p]floorplan index set` to this environment until this
            is resolved — see the run for which endpoint/field broke.
          color: "15158332"
          fields: >-
            [{"name": "Environment", "value": "${{ matrix.name }}", "inline": true},
             {"name": "Run", "value": "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}]

  verify-pixel-agents:
    name: Verify Pixel Agents (production)
    runs-on: ubuntu-latest

    steps:
      - name: Initialize contract result
        env:
          RESULT_PATH: ${{ runner.temp }}/pixel-agents-contract-results/production.json
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            '{
              schema_version: 1,
              environment: "production",
              source: null,
              status: "unknown",
              checked_at: null,
              counts: {pass: 0, fail: 0, skipped: 0},
              checks: [],
              detail: "The contract check did not complete. Inspect the workflow run for an infrastructure or setup failure."
            }' > "$RESULT_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # aiohttp/pydantic are what floorplan's own imports need (its
        # WebviewAssetProvider pulls in floorplan/contracts/layout.py, a
        # pydantic model) once contracts.pixel_agents.verify reaches it --
        # see contracts/pixel_agents/verify.py's module docstring for the
        # pixelagents-builds/floorplan-serves split. discord.py itself is not
        # required: importing pixelagents.tests.conftest first (for its
        # redbot stub) also stubs `discord` in sys.modules before anything
        # does a real `import discord`. Matches the dependency set
        # vendor-update.yml's real-build gate installs for this same code
        # path. pyyaml/jsonschema are for contracts/pixel_agents/verify_outbound.py
        # and schema.py, which parse the cloned repo's core/asyncapi.yaml and
        # validate captured messages against it.
        run: pip install aiohttp 'pydantic>=2.11.3,<2.14' 'pyyaml>=6.0' 'jsonschema>=4.20'

      - name: Run contract check
        run: |
          python -m contracts.pixel_agents.verify \
            --env-name production \
            --output-json "${{ runner.temp }}/pixel-agents-contract-results/production.json"

      - name: Upload contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-agents-contract-result-production
          path: ${{ runner.temp }}/pixel-agents-contract-results/production.json
          if-no-files-found: error
          retention-days: 1

      - name: Notify on failure
        if: failure()
        uses: nntin/d-flows/actions/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message_type: "embed"
          title: "❌ Pixel Agents contract check failed"
          description: >-
            The pinned Pixel Agents commit (`pixelagents/infrastructure/webview_vendor.commit`)
            no longer builds and serves cleanly against upstream — see the run for which
            check broke.
          color: "15158332"
          fields: >-
            [{"name": "Run", "value": "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}]

  build-status-site:
    name: Build current status site
    needs: [verify-contract, verify-pixel-agents]
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Pixel Index contract results
        uses: actions/download-artifact@v5
        with:
          pattern: pixel-index-contract-result-*
          path: ${{ runner.temp }}/pixel-index-contract-results
          merge-multiple: true

      - name: Download Pixel Agents contract results
        uses: actions/download-artifact@v5
        with:
          pattern: pixel-agents-contract-result-*
          path: ${{ runner.temp }}/pixel-agents-contract-results
          merge-multiple: true

      - name: Generate Pixel Index status site
        env:
          RESULTS_DIR: ${{ runner.temp }}/pixel-index-contract-results
          OUTPUT_DIR: ${{ runner.temp }}/contract-site
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m contracts.pixel_index.generate_status_site \
            --results-dir "$RESULTS_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --repository "${{ github.repository }}" \
            --branch "$DEFAULT_BRANCH" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --event "${{ github.event_name }}"

      - name: Generate Pixel Agents status site
        env:
          RESULTS_DIR: ${{ runner.temp }}/pixel-agents-contract-results
          OUTPUT_DIR: ${{ runner.temp }}/contract-site/pixel-agents
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m contracts.pixel_agents.generate_status_site \
            --results-dir "$RESULTS_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --repository "${{ github.repository }}" \
            --branch "$DEFAULT_BRANCH" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --event "${{ github.event_name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/contract-site

  deploy-status-site:
    name: Deploy current status site
    needs: build-status-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
