# Hand-authored -- there is no Python to introspect yet. Describes
# corridor's not-yet-implemented Pub/Sub domain model, from
# docs/corridor-pubsub-design.md's "Domain model: a closed set of
# agent-activity dataclasses" section.
#
# Nothing in corridor/ implements this yet -- see that doc's "Implementation
# status" table. This file's only CI check today is well-formedness
# (contracts/corridor/lint_corridor_contract.py): the file parses, its event
# set matches the doc exactly, every name is cross-referenced in the doc's
# text, and every field has a declared type. It does NOT check anything
# against real corridor code -- a real consumer-driven check (does
# corridor/domain/models.py actually match this?) is explicit follow-up
# work, once the implementation PR referenced in the doc gives it something
# real to check against.
version: 1
status: design-only
source_doc: docs/corridor-pubsub-design.md
events:
  AgentRef:
    kind: value-object
    fields:
      discord_user_id:
        type: int
      guild_id:
        type: int
      is_bot:
        type: bool
  AgentReplied:
    kind: event
    fields:
      agent:
        type: AgentRef
      summary:
        type: str
  AgentToolStarted:
    kind: event
    fields:
      agent:
        type: AgentRef
      tool_id:
        type: str
      status:
        type: str
      tool_name:
        type: "str | None"
        default: null
  AgentStatusChanged:
    kind: event
    fields:
      agent:
        type: AgentRef
      status:
        type: 'Literal["active", "waiting"]'
      awaiting_input:
        type: "bool | None"
        default: null
  AgentHighlighted:
    kind: event
    fields:
      agent:
        type: AgentRef
  AgentUnhighlighted:
    kind: event
    fields:
      agent:
        type: AgentRef
