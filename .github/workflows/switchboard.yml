name: "Switchboard"

# switchboard is the one cog that must run without corridor, so it gets its
# own workflow instead of a cogs-quality.yml matrix leg: its tests and type
# check run against the real red-discordbot package (it cannot share
# corridor's sys.modules stubs), and its end-to-end job exercises the
# [p]addpath route check-cogs.yml never touches.

on:
  workflow_dispatch:
  push:
    paths:
      - "switchboard/**"
      - ".github/actions/test-switchboard/**"
      - ".github/workflows/switchboard.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "switchboard/**"
      - ".github/actions/test-switchboard/**"
      - ".github/workflows/switchboard.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: switchboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # Nothing beyond Red itself: switchboard's info.json declares no
        # requirements, and `packaging` comes with red-discordbot.
        run: |
          python -m pip install --upgrade pip
          python -m pip install red-discordbot pytest pytest-timeout ruff mypy

      - name: Run tests
        run: python -m pytest -q switchboard/

      - name: Check formatting
        run: ruff format --check switchboard

      - name: Run Ruff
        run: ruff check switchboard

      - name: Check production typing
        run: python -m mypy switchboard

  e2e:
    name: End-to-end (${{ matrix.source }})
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        # addpath: switchboard itself comes from [p]addpath, like every other
        # cog. downloader: switchboard comes from [p]repo add + [p]cog
        # install while the rest stay on addpath -- it must say so, and
        # report its addpath copy as shadowed.
        source: [addpath, downloader]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Red-DiscordBot
        # Deliberately nothing else: every office cog's requirements must
        # arrive through switchboard.
        run: python -m pip install red-discordbot

      - name: Run end-to-end checks
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SOURCE: ${{ matrix.source }}
          WORKSPACE: ${{ github.workspace }}
          DATA_DIR: ${{ runner.temp }}/switchboard-${{ matrix.source }}
        run: .github/actions/test-switchboard/run.sh
