name: "Cogs Quality"

on:
  push:
    paths:
      - "corridor/**/*.py"
      - "pixelagents/**/*.py"
      - "pixelagents/infrastructure/webview_vendor.commit"
      - "pixelagents/infrastructure/webview_build_scripts/**"
      - "floorplan/**/*.py"
      - "toolbox/**/*.py"
      - "pico/**/*.py"
      - "testbench/**/*.py"
      - "deskutils/**/*.py"
      - "architect/**/*.py"
      - "contracts/pixel_index/**"
      - "contracts/pixel_agents/**"
      - "contracts/corridor/**"
      - "corridor/corridor.yaml"
      - "docs/corridor-pubsub-design.md"
      - "pyproject.toml"
      - ".github/workflows/cogs-quality.yml"
  pull_request:
    paths:
      - "corridor/**/*.py"
      - "pixelagents/**/*.py"
      - "pixelagents/infrastructure/webview_vendor.commit"
      - "pixelagents/infrastructure/webview_build_scripts/**"
      - "floorplan/**/*.py"
      - "toolbox/**/*.py"
      - "pico/**/*.py"
      - "testbench/**/*.py"
      - "deskutils/**/*.py"
      - "architect/**/*.py"
      - "contracts/pixel_index/**"
      - "contracts/pixel_agents/**"
      - "contracts/corridor/**"
      - "corridor/corridor.yaml"
      - "docs/corridor-pubsub-design.md"
      - "pyproject.toml"
      - ".github/workflows/cogs-quality.yml"

permissions:
  contents: read

concurrency:
  group: cogs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and types (${{ matrix.cog }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # corridor now also owns the shared LLM connection (LiteLLMClient,
          # moved from pico -- see docs/architect-design.md), so unlike
          # toolbox/testbench below it needs aiohttp/pydantic too.
          - cog: corridor
            test_target: "corridor/"
            lint_target: "corridor"
            mypy_target: "corridor"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.14' 'pyyaml>=6.0'"
            pixel_index_contracts: false
          - cog: toolbox
            test_target: "toolbox/"
            lint_target: "toolbox"
            mypy_target: "toolbox"
            extra_deps: ""
            pixel_index_contracts: false
          # testbench's schema comes from corridor.event_catalog.build_contract()
          # in-process (no YAML parsing at runtime) -- no pyyaml needed here,
          # unlike corridor's own leg above (which needs it for the
          # contracts.corridor.generate_corridor_contract/lint_corridor_contract
          # steps below).
          - cog: testbench
            test_target: "testbench/"
            lint_target: "testbench"
            mypy_target: "testbench"
            extra_deps: ""
            pixel_index_contracts: false
          # pixelagents shrank to a vendor+build utility cog (like toolbox) --
          # no aiohttp/pydantic left, and no Pixel Index contracts of its own.
          - cog: pixelagents
            test_target: "pixelagents/tests"
            lint_target: "pixelagents"
            mypy_target: "pixelagents"
            extra_deps: "'pyyaml>=6.0' 'jsonschema>=4.20'"
            pixel_index_contracts: false
          # floorplan inherited the runtime half of the old pixelagents Cog:
          # the dashboard, office WebSocket protocol, and Pixel Index
          # integration, so it inherits that half's dependencies too.
          - cog: floorplan
            test_target: "floorplan/tests"
            lint_target: "floorplan"
            mypy_target: "floorplan"
            extra_deps: "aiohttp"
            pixel_index_contracts: true
          # pico talks to aiohttp (LiteLLM proxy) and pydantic (wire/tool
          # models) like floorplan, but has no Pixel Index integration of
          # its own -- install pydantic directly rather than pulling in the
          # unrelated Pixel Index contract dependencies for it.
          - cog: pico
            test_target: "pico/"
            lint_target: "pico"
            mypy_target: "pico"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.14'"
            pixel_index_contracts: false
          # deskutils only reads the system clock and stdlib zoneinfo, same
          # discord.py-stub-only shape as corridor/toolbox/testbench above.
          - cog: deskutils
            test_target: "deskutils/"
            lint_target: "deskutils"
            mypy_target: "deskutils"
            extra_deps: ""
            pixel_index_contracts: false
          # architect talks to aiohttp/pydantic like pico (the shared
          # corridor-owned LLM connection), plus a2a-sdk (its A2A server --
          # http-server extra pulls in starlette/sse-starlette) and uvicorn
          # to run its dedicated listener. No Pixel Index integration.
          - cog: architect
            test_target: "architect/"
            lint_target: "architect"
            mypy_target: "architect"
            extra_deps: "aiohttp 'pydantic>=2.11.3,<2.14' 'a2a-sdk[http-server]' uvicorn"
            pixel_index_contracts: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'discord.py>=2.7,<2.8' pytest pytest-timeout ruff mypy ${{ matrix.extra_deps }}

      - name: Install Pixel Index contract dependencies
        if: matrix.pixel_index_contracts
        run: python -m pip install -r contracts/pixel_index/requirements.txt

      - name: Run ${{ matrix.cog }} tests
        # Each cog installs its own, mutually incompatible
        # `sys.modules["redbot.core"]` stub -- running more than one cog's
        # suite in the same pytest process makes whichever collects first
        # silently win for the whole session. The matrix keeps each cog in
        # its own job/process instead of one combined run.
        run: python -m pytest -q ${{ matrix.test_target }}

      - name: Check formatting
        run: ruff format --check ${{ matrix.lint_target }}

      - name: Run Ruff
        run: ruff check ${{ matrix.lint_target }}

      - name: Test shared lint tooling (contracts/ast_call_graph.py)
        # Also cross-cog, not scoped to matrix.lint_target -- run once.
        if: matrix.cog == 'corridor'
        run: python -m unittest discover -s contracts/tests

      - name: Check reply-channel compliance (respects corridor's ReplyMode)
        # Scans corridor/floorplan/pixelagents/toolbox together in one pass
        # (it's a cross-cog check, not scoped to matrix.lint_target) -- run
        # it once rather than once per matrix leg.
        if: matrix.cog == 'corridor'
        run: python -m contracts.discord_replies.lint_reply_channel

      - name: Check production typing
        # Scoped to this cog's own files: an unscoped `python -m mypy` would
        # check pyproject.toml's full `files` list, which spans every cog --
        # pulling in dependencies (aiohttp/pydantic) a corridor/toolbox-only
        # job has no other reason to install.
        run: python -m mypy ${{ matrix.mypy_target }}

      - name: Check Pixel Index endpoint registration
        if: matrix.pixel_index_contracts
        run: python -m contracts.pixel_index.lint_endpoints

      - name: Check Pixel Index model usage
        if: matrix.pixel_index_contracts
        run: python -m contracts.pixel_index.lint_model_usage

      - name: Test contract reporting
        if: matrix.pixel_index_contracts
        run: python -m unittest discover -s contracts/pixel_index/tests

      - name: Test Pixel Agents contract reporting
        # Exercises pixelagents' build pipeline *and* floorplan's
        # WebviewAssetProvider consuming it (see contracts/pixel_agents/verify.py)
        # -- needs floorplan's deps (pydantic, via this leg's Pixel Index
        # contract install above), so it runs on the floorplan leg rather
        # than pixelagents'. This discover also picks up
        # test_generate_consumer_contract.py/test_lint_outbound_contract.py
        # (below) automatically -- no separate step needed for those here.
        if: matrix.cog == 'floorplan'
        run: python -m unittest discover -s contracts/pixel_agents/tests

      - name: Check pixel-agents-consumer-contract.yaml is up to date
        # Offline -- pixelagents/contracts/outbound.py + application/office.py
        # are plain-stdlib TypedDicts, no clone/floorplan deps needed. See
        # .github/workflows/pixel-agents-contract-lint.yml for the dedicated,
        # narrower-triggered version of these same two checks.
        if: matrix.cog == 'pixelagents'
        run: python -m contracts.pixel_agents.generate_consumer_contract --check

      - name: Check outbound builders match the committed consumer contract
        if: matrix.cog == 'pixelagents'
        run: python -m contracts.pixel_agents.lint_outbound_contract

      - name: Check corridor.yaml is up to date
        # Offline -- corridor/domain/models.py is plain-stdlib dataclasses,
        # no clone/network needed.
        if: matrix.cog == 'corridor'
        run: python -m contracts.corridor.generate_corridor_contract --check

      - name: Check corridor.yaml matches the design doc
        if: matrix.cog == 'corridor'
        run: python -m contracts.corridor.lint_corridor_contract

      - name: Test corridor contract tooling
        if: matrix.cog == 'corridor'
        run: python -m unittest discover -s contracts/corridor/tests
